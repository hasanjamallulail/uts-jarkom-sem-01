frr version 10.4.1
frr defaults traditional
hostname R-HQ
!
interface eth1
 ip address 10.0.0.1/30
!
interface eth2
 ip address 10.0.0.5/30
!
interface eth3
 ip address 10.0.0.9/30
!
interface eth4
 ip address 10.10.10.1/24
!
ip forwarding
!
line vty
!
!

!
router rip
 version 2
 no auto-summary
 network 10.0.0.0/30
 network 10.0.0.4/30
 network 10.0.0.8/30
 network 10.10.10.0/24
!
